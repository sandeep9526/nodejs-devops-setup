name: CI

on:
push:
branches: ["main"]
pull_request:
workflow_dispatch:

permissions:
contents: read

jobs:
test-and-lint:
name: Test and lint
runs-on: ubuntu-latest

```
steps:
  - name: Checkout repository
    uses: actions/checkout@v4

  - name: Set up Node.js
    uses: actions/setup-node@v4
    with:
      node-version: "22"
      cache: npm

  - name: Install dependencies
    run: npm ci

  # - name: Run tests
  #   run: npm test

  # - name: Run ESLint
  #   run: npm run lint
```

secrets:
name: Scan for secrets
runs-on: ubuntu-latest

```
steps:
  - name: Checkout full Git history
    uses: actions/checkout@v4
    with:
      fetch-depth: 0

  - name: Run Gitleaks
    uses: gitleaks/gitleaks-action@v2
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
```

image-security:
name: Build and scan Docker image
runs-on: ubuntu-latest

```
steps:
  - name: Checkout repository
    uses: actions/checkout@v4

  - name: Build Docker image
    run: |
      docker build \
        -f infra/docker/Dockerfile \
        -t nodejs-api:ci \
        .

  - name: Scan image with Trivy
    uses: aquasecurity/trivy-action@0.28.0
    with:
      image-ref: nodejs-api:ci
      format: table
      exit-code: "1"
      ignore-unfixed: true
      vuln-type: os,library
      severity: CRITICAL,HIGH
```
publish-ghcr:
name: Publish image to GHCR
runs-on: ubuntu-latest
needs:
- test-and-lint
- secrets
- image-security
if: github.event_name == 'push' && github.ref == 'refs/heads/main'

```
permissions:
  contents: read
  packages: write

steps:
  - name: Checkout repository
    uses: actions/checkout@v4

  - name: Prepare lowercase image name
    id: image
    shell: bash
    run: |
      IMAGE_NAME="ghcr.io/$(echo "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')"
      echo "name=$IMAGE_NAME" >> "$GITHUB_OUTPUT"

  - name: Set up Docker Buildx
    uses: docker/setup-buildx-action@v3

  - name: Build Docker image
    uses: docker/build-push-action@v6
    with:
      context: .
      file: infra/docker/Dockerfile
      tags: nodejs-api:release
      load: true

  - name: Scan release image
    uses: aquasecurity/trivy-action@0.28.0
    with:
      image-ref: nodejs-api:release
      format: table
      exit-code: "1"
      ignore-unfixed: true
      vuln-type: os,library
      severity: CRITICAL,HIGH

  - name: Log in to GHCR
    uses: docker/login-action@v3
    with:
      registry: ghcr.io
      username: ${{ github.actor }}
      password: ${{ secrets.GITHUB_TOKEN }}

  - name: Tag release image
    shell: bash
    env:
      IMAGE_NAME: ${{ steps.image.outputs.name }}
    run: |
      docker tag nodejs-api:release "$IMAGE_NAME:sha-$GITHUB_SHA"
      docker tag nodejs-api:release "$IMAGE_NAME:latest"

  - name: Push release image
    shell: bash
    env:
      IMAGE_NAME: ${{ steps.image.outputs.name }}
    run: |
      docker push "$IMAGE_NAME:sha-$GITHUB_SHA"
      docker push "$IMAGE_NAME:latest"
```
