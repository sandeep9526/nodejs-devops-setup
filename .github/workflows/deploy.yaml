name: Deploy to AWS

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: production-deployment
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy production
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 25

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Verify this is still the latest main commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COMMIT_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail

          LATEST_SHA="$(gh api "repos/${GITHUB_REPOSITORY}/commits/main" --jq '.sha')"

          if [[ "$COMMIT_SHA" != "$LATEST_SHA" ]]; then
            echo "Skipping stale CI run: $COMMIT_SHA"
            echo "Current main commit is $LATEST_SHA"
            exit 0
          fi

      - name: Verify published image exists
        env:
          COMMIT_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          IMAGE="ghcr.io/${GITHUB_REPOSITORY}:sha-${COMMIT_SHA}"
          docker manifest inspect "$IMAGE" >/dev/null
          echo "Verified image: $IMAGE"

      - name: Configure AWS credentials through OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ap-south-1

      - name: Send deployment command and verify its result
        env:
          COMMIT_SHA: ${{ github.event.workflow_run.head_sha }}
        shell: bash
        run: |
          set -euo pipefail

          # Recheck main immediately before requesting deployment.
          LATEST_SHA="$(gh api "repos/${GITHUB_REPOSITORY}/commits/main" --jq '.sha')"
          if [[ "$COMMIT_SHA" != "$LATEST_SHA" ]]; then
            echo "Skipping stale commit; main has advanced to $LATEST_SHA"
            exit 0
          fi

          # Use JSON generation instead of manually quoting SSM parameters.
          jq -n --arg sha "$COMMIT_SHA" '{
            commands: [
              "set -euo pipefail",
              "cd /opt/nodejs-api/repo",
              ("git fetch --depth 1 origin " + $sha),
              ("git checkout --detach " + $sha),
              ("sudo /opt/nodejs-api/repo/scripts/deploy.sh sha-" + $sha)
            ]
          }' > /tmp/ssm-parameters.json

          RESPONSE="$(aws ssm send-command \
            --document-name "AWS-RunShellScript" \
            --targets "Key=tag:DeploymentTarget,Values=nodejs-api-production" \
            --comment "Deploy ${COMMIT_SHA}" \
            --parameters file:///tmp/ssm-parameters.json \
            --query 'Command' \
            --output json)"

          COMMAND_ID="$(jq -r '.CommandId' <<< "$RESPONSE")"
          INSTANCE_IDS="$(jq -c '.InstanceIds // []' <<< "$RESPONSE")"
          COUNT="$(jq 'length' <<< "$INSTANCE_IDS")"

          if [[ "$COUNT" -ne 1 ]]; then
            echo "Expected exactly one SSM target; received: $INSTANCE_IDS" >&2
            exit 1
          fi

          INSTANCE_ID="$(jq -r '.[0]' <<< "$INSTANCE_IDS")"
          echo "SSM command: $COMMAND_ID"
          echo "Target instance: $INSTANCE_ID"

          DEADLINE=$((SECONDS + 900))
          STATUS="Pending"

          while (( SECONDS < DEADLINE )); do
            if INVOCATION="$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID" \
              --output json 2>/dev/null)"; then

              STATUS="$(jq -r '.Status' <<< "$INVOCATION")"

              case "$STATUS" in
                Success)
                  echo "Deployment command succeeded."
                  jq -r '.StandardOutputContent // ""' <<< "$INVOCATION"
                  exit 0
                  ;;
                Failed|Cancelled|TimedOut|Cancelling)
                  echo "Deployment failed with status: $STATUS" >&2
                  jq -r '"STDOUT:\n" + (.StandardOutputContent // "") + "\nSTDERR:\n" + (.StandardErrorContent // "")' <<< "$INVOCATION"
                  exit 1
                  ;;
              esac
            fi

            sleep 5
          done

          echo "Timed out waiting for SSM command $COMMAND_ID (last status: $STATUS)" >&2
          exit 1
